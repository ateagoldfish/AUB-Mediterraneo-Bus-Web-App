<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Dorm Shuttle</title>
  <meta name="theme-color" content="#840132">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../src/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../src/css/style.css">
  <script type="module" src="../src/js/admin.js"></script>
</head>
<body data-i18n-title="admin.title">
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="./">
        <img src="../src/img/bus.svg" alt="">
        <span>
          <span class="brand-name" data-i18n="app.name"></span><br>
          <span class="brand-tagline" data-i18n="admin.title"></span>
        </span>
      </a>
      <div class="header-actions">
        <a class="btn btn-light" href="../" target="_blank" rel="noopener" data-i18n="admin.viewSite"></a>
        <button id="logout" class="btn btn-light" type="button" data-i18n="admin.logout" hidden></button>
      </div>
    </div>
  </header>

  <main>
    <noscript><div class="banner banner-conn">This page needs JavaScript and an up-to-date browser.</div></noscript>
    <div id="admin-msg" class="banner banner-conn" role="alert" hidden></div>
    <p id="admin-loading" class="muted" data-i18n="app.loading"></p>

    <div id="login" class="card page-narrow" hidden>
      <h1 class="login-title" data-i18n="admin.loginTitle"></h1>
      <form id="login-form" novalidate>
        <label for="login-passcode" data-i18n="admin.loginLabel"></label>
        <input id="login-passcode" type="password" autocomplete="current-password" required>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <p><button class="btn" type="submit" data-i18n="admin.loginSubmit"></button></p>
      </form>
    </div>

    <div id="panel" hidden>
      <!-- Sticks to the top while scrolling; highlights the section in view (D-033). -->
      <nav class="admin-nav" id="admin-nav">
        <a href="#alerts" data-i18n="admin.nav.alerts"></a>
        <a href="#hours" data-i18n="admin.nav.hours"></a>
        <a href="#timetable" data-i18n="admin.nav.timetable"></a>
        <a href="#passcodes" data-i18n="admin.nav.passcodes"></a>
      </nav>

      <div id="tracker-status" class="banner" role="status"></div>

      <!-- Live tracking ON/OFF: at the top so it can be found quickly in an emergency (D-032). -->
      <div id="tracking-card" class="card tracking-card">
        <div class="switch-row">
          <div>
            <h2 data-i18n="admin.switch.title"></h2>
            <p id="tracking-status" class="tracking-status"></p>
          </div>
          <button id="tracking-switch" class="switch" type="button" role="switch" aria-checked="true"
                  data-i18n-aria-label="admin.switch.title">
            <span class="switch-knob"></span><span id="switch-label" class="switch-label"></span>
          </button>
        </div>
        <div id="resume-field" class="field">
          <label for="resume-at" data-i18n="admin.switch.resumeAt"></label>
          <input id="resume-at" type="datetime-local">
        </div>
        <p class="muted small" data-i18n="admin.switch.help"></p>
        <p id="tracking-msg" class="form-msg" role="alert" hidden></p>
      </div>

      <!-- Alerts -->
      <section id="alerts" class="admin-section">
        <h2 class="eyebrow" data-i18n="admin.nav.alerts"></h2>
        <div class="card">
          <h2 data-i18n="admin.alerts.active"></h2>
          <div id="alert-list"></div>
          <p id="alert-list-msg" class="form-msg" role="alert" hidden></p>
        </div>
        <div class="card">
          <h2 data-i18n="admin.alerts.new"></h2>
          <form id="alert-form" novalidate>
            <div class="form-row">
              <div class="field">
                <label for="alert-type" data-i18n="admin.alerts.type"></label>
                <select id="alert-type">
                  <option value="delay" data-i18n="alert.delay"></option>
                  <option value="cancel" data-i18n="alert.cancel"></option>
                  <option value="info" data-i18n="alert.info"></option>
                </select>
              </div>
              <div class="field" id="delay-field">
                <label for="alert-delay" data-i18n="admin.alerts.delayMin"></label>
                <input id="alert-delay" type="number" min="1" max="240" inputmode="numeric">
              </div>
            </div>
            <div class="field">
              <label for="alert-message" data-i18n="admin.alerts.message"></label>
              <textarea id="alert-message" maxlength="300" data-i18n-placeholder="admin.alerts.messagePlaceholder"></textarea>
            </div>
            <fieldset class="field plain-fieldset" id="affects-field">
              <legend data-i18n="admin.alerts.affects"></legend>
              <div id="affects-list" class="check-list"></div>
            </fieldset>
            <div class="field">
              <label for="alert-expires" data-i18n="admin.alerts.expires"></label>
              <input id="alert-expires" type="datetime-local">
            </div>
            <button class="btn" type="submit" data-i18n="admin.alerts.publish"></button>
            <p class="form-msg" hidden></p>
          </form>
        </div>
      </section>

      <!-- Service hours -->
      <section id="hours" class="admin-section">
        <h2 class="eyebrow" data-i18n="admin.hours.title"></h2>
        <div class="card">
          <p class="muted small" data-i18n="admin.hours.help"></p>
          <form id="hours-form" novalidate>
            <div id="hours-grid" class="hours-grid"></div>
            <p><button class="btn" type="submit" data-i18n="admin.hours.save"></button></p>
            <p class="form-msg" hidden></p>
          </form>
        </div>
      </section>

      <!-- Timetable -->
      <section id="timetable" class="admin-section">
        <h2 class="eyebrow" data-i18n="admin.nav.timetable"></h2>
        <p class="muted small" data-i18n="admin.tt.help"></p>
        <div id="day-picker" class="day-picker" role="group" data-i18n-aria-label="admin.tt.days"></div>
        <div id="trip-list" class="trip-list"></div>
        <p><button id="add-trip" class="btn btn-outline" type="button" data-i18n="admin.tt.add"></button></p>
        <div class="sticky-save">
          <button id="save-trips" class="btn" type="button" data-i18n="admin.tt.save"></button>
          <button id="clear-trips" class="btn btn-outline btn-small" type="button" data-i18n="admin.tt.clearAll"></button>
          <div id="trips-msg" class="form-msg" role="alert" hidden></div>
          <div id="trips-unsaved" class="form-msg form-error" data-i18n="admin.tt.unsaved" hidden></div>
        </div>

        <div class="card">
          <h2 data-i18n="admin.travel.title"></h2>
          <p id="travel-help" class="muted small"></p>
          <form id="travel-form" novalidate>
            <div id="travel-list" class="travel-list"></div>
            <p><button class="btn" type="submit" data-i18n="admin.travel.save"></button></p>
            <p class="form-msg" hidden></p>
          </form>
        </div>
      </section>

      <!-- Passcodes -->
      <section id="passcodes" class="admin-section">
        <h2 class="eyebrow" data-i18n="admin.nav.passcodes"></h2>
        <div class="card">
          <h2 data-i18n="admin.pass.student"></h2>
          <p class="muted small" data-i18n="admin.pass.studentHelp"></p>
          <div class="admin-blocks">
            <p id="blocks-text" class="small"></p>
            <button id="clear-blocks" class="btn btn-outline btn-small" type="button" data-i18n="admin.blocks.clear" hidden></button>
            <p id="blocks-msg" class="form-msg" role="alert" hidden></p>
          </div>
          <form class="pass-form" data-kind="student" novalidate>
            <div class="form-row">
              <div class="field"><label for="student-new" data-i18n="admin.pass.new"></label><input id="student-new" type="text" autocomplete="off"></div>
              <div class="field"><label for="student-confirm" data-i18n="admin.pass.confirm"></label><input id="student-confirm" type="text" autocomplete="off"></div>
            </div>
            <button class="btn" type="submit" data-i18n="admin.pass.save"></button>
            <p class="form-msg" hidden></p>
          </form>
        </div>
        <div class="card">
          <h2 data-i18n="admin.pass.admin"></h2>
          <p class="muted small" data-i18n="admin.pass.adminHelp"></p>
          <form class="pass-form" data-kind="admin" novalidate>
            <div class="form-row">
              <div class="field"><label for="admin-new" data-i18n="admin.pass.new"></label><input id="admin-new" type="password" autocomplete="new-password"></div>
              <div class="field"><label for="admin-confirm" data-i18n="admin.pass.confirm"></label><input id="admin-confirm" type="password" autocomplete="new-password"></div>
            </div>
            <button class="btn" type="submit" data-i18n="admin.pass.save"></button>
            <p class="form-msg" hidden></p>
          </form>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
