<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dorm Shuttle</title>
  <meta name="description" content="Live location, timetable and alerts for the campus–dorms shuttle bus.">
  <meta name="theme-color" content="#840132">
  <meta name="robots" content="noindex">
  <link rel="icon" href="src/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="src/img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="src/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="src/css/style.css">
  <script src="src/vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="src/js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="./">
        <img src="src/img/bus.svg" alt="">
        <span>
          <span class="brand-name" data-i18n="app.name"></span><br>
          <span class="brand-tagline" data-i18n="app.tagline"></span>
        </span>
      </a>
    </div>
  </header>

  <main>
    <!-- Text in <noscript> can't come from the strings file, because that needs JavaScript. -->
    <noscript><div class="banner banner-conn">This site needs JavaScript and an up-to-date browser.</div></noscript>

    <div id="conn-banner" class="banner banner-conn" role="status" hidden></div>
    <div id="alerts" aria-live="polite"></div>

    <div class="layout">
      <div>
        <section aria-labelledby="map-heading">
          <h2 id="map-heading" class="eyebrow" data-i18n="section.map"></h2>
          <div class="card map-card">
            <div id="map" role="region" data-i18n-aria-label="section.map"></div>

            <div id="passcode-overlay" class="map-overlay" hidden>
              <div class="passcode-box">
                <h2 data-i18n="pass.title"></h2>
                <p class="muted small" data-i18n="pass.help"></p>
                <form id="passcode-form" novalidate>
                  <label for="passcode-input" data-i18n="pass.label"></label>
                  <input id="passcode-input" type="password" autocomplete="current-password" required>
                  <p id="passcode-error" class="form-error" role="alert" hidden></p>
                  <button class="btn" type="submit" data-i18n="pass.submit"></button>
                </form>
              </div>
            </div>

            <div id="map-unavailable" class="map-overlay" hidden>
              <p data-i18n="map.unavailable"></p>
            </div>

            <div class="map-status" role="status" aria-live="polite">
              <span id="live-dot" class="dot"></span>
              <span id="live-text" class="grow" data-i18n="live.checking"></span>
            </div>
          </div>
          <p class="small"><button id="forget-passcode" class="link-button" type="button" data-i18n="pass.forget" hidden></button></p>
        </section>
      </div>

      <div>
        <section id="next-section" aria-labelledby="next-heading">
          <h2 id="next-heading" class="eyebrow" data-i18n="section.next"></h2>
          <div id="next" class="next-grid">
            <div class="card next-card"><div class="skeleton">&nbsp;</div><div class="skeleton next-time">&nbsp;</div></div>
            <div class="card next-card"><div class="skeleton">&nbsp;</div><div class="skeleton next-time">&nbsp;</div></div>
          </div>
        </section>

        <section aria-labelledby="tt-heading">
          <h2 id="tt-heading" class="eyebrow" data-i18n="section.timetable"></h2>
          <div class="card">
            <div id="timetable"><p class="skeleton">&nbsp;</p><p class="skeleton">&nbsp;</p><p class="skeleton">&nbsp;</p></div>
            <details id="other-days" class="tt-days" hidden>
              <summary data-i18n="tt.otherDays"></summary>
              <label for="day-select" class="visually-hidden" data-i18n="tt.otherDays"></label>
              <select id="day-select"></select>
              <div id="day-timetable"></div>
            </details>
          </div>
        </section>

        <section aria-labelledby="hours-heading">
          <h2 id="hours-heading" class="eyebrow" data-i18n="section.hours"></h2>
          <div class="card" id="hours"><p class="skeleton">&nbsp;</p></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span data-i18n="app.disclaimer"></span> · <a href="privacy.html" data-i18n="app.privacyLink"></a>
  </footer>

  <div id="demo-bar" class="demo-bar" hidden>
    <div class="inner">
      <strong data-i18n="demo.label"></strong>
      <label class="inline-check" style="color:#fff;font-weight:500;margin:0">
        <span data-i18n="demo.scenario"></span>
        <select id="demo-scenario"></select>
      </label>
      <span id="demo-hint"></span>
      <button id="demo-reset" class="link-button" type="button" data-i18n="demo.reset"></button>
    </div>
  </div>
</body>
</html>
